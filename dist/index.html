<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Not the Leaving, but the Believing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=20">
</head>
<body>
<main id="viewer" aria-label="Cinematic narrative viewer">
  <!-- Scene slots populated by JS -->
</main>

<nav id="controls" aria-label="Scene navigation">
  <button id="prev-btn" aria-label="Previous scene" class="nav-arrow nav-prev">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 4 7 12 15 20"/></svg>
  </button>
  <div id="progress" class="progress-indicator" aria-live="polite">
    <span id="current-num">01</span>
    <span class="progress-sep">/</span>
    <span id="total-num">16</span>
  </div>
  <button id="next-btn" aria-label="Next scene" class="nav-arrow nav-next">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 4 17 12 9 20"/></svg>
  </button>
</nav>

<div id="instruction" class="instruction-hint" aria-hidden="true">→</div>

<!-- Background audio: Hans Zimmer - Time (Inception) -->
<audio id="bg-audio" src="assets/time_inception.mp3?v=20" preload="auto" loop></audio>

<script src="assets/app.js?v=20"></script>
</body>
</html>
